name: 'UnKDownloader & SaVe in RePo'

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'DiReCt LiNK'
        required: true
        type: string
      password:
        description: 'CusTom PassWoRd 4ZipFile'
        required: false
        type: string
        default: ''
      split_size:
        description: 'SiZe of EacH PaRT pEr MB Ex: 52m'
        required: false
        type: string
        default: '52m'

permissions:
  contents: write  #ImP (Acces To The Repo)

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: ReciEvE Repo CodE By↔️#UnKnOwN↔️
        uses: actions/checkout@v4

      - name: InsTaLL TooLs By↔️#UnKnOwN↔️
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file

      - name: Files DowNLoadiNg By↔️#UnKnOwN↔️
        id: download
        run: |
          URL="${{ github.event.inputs.file_url }}"
          echo "DowNLoadiNg FRom : $URL"
          curl -L --fail --retry 5 --retry-delay 5 --progress-bar -o downloaded_file "$URL"
          if [ $? -ne 0 ]; then exit 1; fi
          ls -lh downloaded_file

      - name: NamE & TyPe DeTecT By↔️#UnKnOwN↔️
        id: classify
        run: |
          # OrGiNaL NaMe By↔️#UnKnOwN↔️
          RAW_NAME=$(basename "${{ github.event.inputs.file_url }}" | sed 's/\?.*//' | sed 's/%20/ /g')
          if [ -z "$RAW_NAME" ]; then RAW_NAME="unknown_file"; fi
          # RemoVe WronG ChaRacTers By↔️#UnKnOwN↔️
          SAFE_NAME=$(echo "$RAW_NAME" | sed 's/[\\/:*?"<>|]/_/g')
          # MIME
          MIME=$(file -b --mime-type downloaded_file)
          EXT="${RAW_NAME##*.}"
          EXT=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
          
          if [[ "$MIME" == video/* ]] || [[ "$EXT" =~ ^(mp4|mkv|avi|mov|wmv|flv|webm)$ ]]; then
            CAT="video"
          elif [[ "$MIME" == audio/* ]] || [[ "$EXT" =~ ^(mp3|wav|ogg|flac|m4a)$ ]]; then
            CAT="audio"
          elif [[ "$MIME" == image/* ]] || [[ "$EXT" =~ ^(jpg|jpeg|png|gif|bmp|webp)$ ]]; then
            CAT="image"
          elif [[ "$MIME" == application/pdf ]] || [[ "$EXT" =~ ^(pdf|doc|docx|xls|xlsx|ppt|pptx|txt)$ ]]; then
            CAT="document"
          else
            CAT="other"
          fi
          
          echo "CAT=$CAT" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          echo $SAFE_NAME"

      - name: ComPRessiNg & EnQrypTiNg By↔️#UnKnOwN↔️
        run: |
          # FinalTarGet: HeRe/Name/GruoP 
          FINAL_DIR="HeRe/${{ env.CAT }}/${{ env.SAFE_NAME }}"
          mkdir -p "$FINAL_DIR"
          
          # DeleTe LasT FileS (:)
          rm -f "$FINAL_DIR"/*.7z*
          
          # ComPRessiNg By↔️#UnKnOwN↔️
          if [ -z "${{ github.event.inputs.password }}" ]; then
            7z a -mhe=on -mx=3 -v${{ github.event.inputs.split_size }} "$FINAL_DIR/archive.7z" "./downloaded_file"
          else
            7z a -p"${{ github.event.inputs.password }}" -mhe=on -mx=3 -v${{ github.event.inputs.split_size }} "$FINAL_DIR/archive.7z" "./downloaded_file"
          fi
          
          echo "✅ FiLe SaVe In $FINAL_DIR "
          ls -lh "$FINAL_DIR"

      - name: Commit&PushIN Repo By↔️#UnKnOwN↔️
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git commit -m "Add downloaded file: ${{ env.SAFE_NAME }} (category: ${{ env.CAT }})" || echo "Nothing to commit"
          git push
